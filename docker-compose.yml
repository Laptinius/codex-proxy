version: '3.8'

services:
  codex-proxy:
    image: gcr.io/distroless/static-debian12:nonroot
    container_name: codex-proxy
    ports:
      - "8080:8080"
    environment:
      - AUTH_FILE=/home/nonroot/.codex/auth.json
    volumes:
      - ./codex-proxy:/app/codex-proxy:ro
      - ./configs:/app/configs
      - ${HOME}/.codex/auth.json:/home/nonroot/.codex/auth.json:ro
    working_dir: /app
    entrypoint: ["/app/codex-proxy"]
    restart: unless-stopped
